name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.12', '22']  # the oldest supported release, and the current LTS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check that index.html matches the source
        run: |
          npm run build
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date. Run npm run build and commit the result."
            exit 1
          fi
