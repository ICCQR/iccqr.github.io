name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check that index.html matches the source
        run: |
          npm run build
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date. Run npm run build and commit the result."
            exit 1
          fi
